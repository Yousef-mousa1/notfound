[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonizer"
version = "0.2.0"
description = "PyroScope - MODIS/VIIRS active-fire hot spot harmonization (NASA Space Apps 2026, Challenge #8)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Flask>=3.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "shapely>=2.0", "certifi"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "vercel_wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
