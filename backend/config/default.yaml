# Harmonizer configuration.
#
# Every scientific parameter is declared here. Values marked `null` are
# placeholders: they must be justified and verified in the phase that owns
# them. Nothing in this file is a scientific conclusion yet.

project:
  name: "PyroScope"
  team: "Not Found"
  event: "NASA Space Apps Cairo 2026"

paths:
  # Read-only originals. Never written to by any pipeline stage.
  raw: "dataSets"
  interim: "data/interim"
  processed: "data/processed"
  runs: "data/processed/runs"
  uploads: "data/interim/uploads"
  # Exported files are new outputs; imported observations are never modified.
  exports: "data/processed/exports"
  # Model-produced estimate series may only be imported from this directory
  # (relative to the project root). Kept outside backend/ so it cannot read
  # arbitrary absolute paths through /estimates/import.
  estimates: "../modeling/outputs"

# Slice E: exports.
exports:
  # Refuse a single export larger than this, with a structured 413.
  max_rows: 500000
  # The full harmonized estimate series (~813k rows) uses a dedicated higher cap.
  estimate_max_rows: 1000000

storage:
  # Analytical store. Raw CSVs are never modified; they are imported into this
  # DuckDB file and the original row is preserved in `raw_json`.
  duckdb_path: "data/processed/pyroscope.duckdb"

api:
  prefix: "/api/v1"
  # Origins allowed to call this API from a browser (CORS).
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  default_limit: 100
  max_limit: 1000

ingestion:
  allowed_extensions:
    - ".csv"
  # Platform mapping is an ENGINEERING ASSUMPTION derived from the sample
  # `satellite` values. Re-verify against FIRMS documentation in Phase 03.
  platform_mapping:
    Terra: "Terra"
    Aqua: "Aqua"
    N: "S-NPP"
    "1": "NOAA-20"

# Phase 01: unified schema / column mapping live in config, not in code.
schema:
  # Filled in Phase 01 after inspecting the real files.
  column_mapping: null

# Phase 03: confidence harmonization (verified 2026-11-17; see docs/decisions.md).
# VIIRS labels l/n/h are official FIRMS classes. FIRMS defines three MODIS
# classes (low/nominal/high) but does NOT publish numeric cut-offs and calls the
# field experimental; the MODIS bands below are therefore HEURISTIC, not official.
# `source` and `method` are echoed in the normalize response for transparency.
confidence:
  viirs:
    method: "exact"
    source: "FIRMS official l/n/h classes (FIRMS_VIIRS_Firehotspots.html, 2026-11-17)"
    mapping:
      "l": "low"
      "n": "nominal"
      "h": "high"
  modis:
    method: "ranges"
    source: "HEURISTIC bands; FIRMS defines classes but publishes no numeric cut-offs"
    mapping:
      "low": [0, 29]
      "nominal": [30, 79]
      "high": [80, 100]

# Phase 04: temporal matching window, in hours. To be justified in Phase 04.
temporal:
  time_window_h: null
  # UTC verified against FIRMS documentation on 2026-11-17 (see docs/decisions.md).
  timezone: "UTC"

# Phase 05: spatial grid. To be justified in Phase 05.
spatial:
  grid_km: null
  storage_crs: "EPSG:4326"
  # Region boxes are derived from the data extent (not administrative units).
  region_grid: 2

# Phase 07: cross-sensor matching. To be justified with a sensitivity analysis.
matching:
  match_radius_m: null
  time_window_h: null

# Phase 03: non-destructive QC flags. No rows are ever deleted.
quality:
  flags:
    - "invalid_ti4"
    - "type_nonzero"
    - "low_confidence"
    - "night_detection"
